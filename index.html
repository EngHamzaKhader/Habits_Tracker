<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Life RPG</title>
<style>
:root{--bg:#0b1020;--card:#121936;--card2:#171e3a;--text:#f7f7ff;--muted:#9ba3c7;--purple:#7c5cff;--green:#48e6a1;--gold:#ffc857;--orange:#ff8a3d;--red:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0,#21184d 0,#0b1020 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:86px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.logo{font-weight:1000;letter-spacing:2px}.icons{display:flex;gap:6px}.icons button{background:none;border:0;color:white;font-size:20px;padding:4px}
main{padding:10px 16px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
.level{background:linear-gradient(135deg,#261d58,#121936);border-color:#6f55e855}.row{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:11px;color:#aab0cf;letter-spacing:1.6px;font-weight:900}.levelnum{font-size:31px;font-weight:1000;margin-top:3px}.badge{width:60px;height:60px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:1000;font-size:22px}
.bar{height:13px;border-radius:20px;background:#2a3150;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7c5cff,#a77cff);width:0%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.small{font-size:12px;color:var(--muted)}.bigpct{font-size:25px;font-weight:1000}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px;font-size:12px;font-weight:1000;letter-spacing:1.5px}
.banner{background:#1b2547;border:1px solid #ffffff10;border-radius:20px;padding:16px;margin-bottom:14px}.banner b{display:block;margin-bottom:4px}
.habit{display:flex;align-items:center;gap:13px;padding:14px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);margin:9px 0;transition:.25s}.habit:active{transform:scale(.98)}.habit.done{background:#14372e;border-color:#48e6a133}.habitmain{display:flex;align-items:center;gap:13px;flex:1;cursor:pointer}.emoji{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;font-size:24px;flex:none}.done .emoji{background:#48e6a122}.habitname{font-weight:850}.xp{margin-left:auto;color:var(--gold);font-weight:1000;font-size:13px;white-space:nowrap}.done .xp{color:var(--green)}
.tags{display:flex;gap:6px;margin-top:3px}.tag{font-size:10px;padding:2px 7px;border-radius:8px;background:#ffffff10;color:var(--muted);font-weight:800}
.minbtn{background:none;border:1px dashed #ffffff30;color:var(--muted);font-size:10px;font-weight:800;border-radius:8px;padding:3px 7px;margin-top:4px;cursor:pointer}
.habitrow{display:flex;flex-direction:column;flex:1}
.momentum{background:linear-gradient(135deg,#42200f,#21130c)}.fire{font-size:35px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1226ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff12;display:flex;justify-content:center;z-index:5}.navin{max-width:560px;width:100%;display:flex}.nav button{flex:1;background:none;border:0;color:#7f87aa;padding:12px 5px 10px;font-size:11px;font-weight:800}.nav button.active{color:white}.nav .ico{display:block;font-size:22px;margin-bottom:2px}.quest{padding:18px;background:rgba(255,255,255,.055);border:1px solid #ffffff0b;border-radius:22px;margin:12px 0}.reward{display:flex;gap:12px;align-items:center}.lock{font-size:24px;width:34px}.green{color:var(--green)}.gold{color:var(--gold)}.purple{color:#a98dff}.btn{border:0;border-radius:14px;background:var(--purple);color:white;padding:12px 17px;font-weight:900}.fab{position:fixed;right:20px;bottom:78px;border:0;width:54px;height:54px;border-radius:50%;background:var(--purple);color:#fff;font-size:28px;box-shadow:0 8px 30px #0008}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#171e3a;border:1px solid #ffffff22;border-radius:18px;padding:14px 18px;font-weight:900;opacity:0;pointer-events:none;transition:.3s;z-index:10;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#141a31;border-radius:28px 28px 0 0;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
input,select{width:100%;padding:13px;border-radius:13px;background:#0c1124;color:white;border:1px solid #ffffff18;margin:6px 0 14px}label{font-size:12px;color:#aab0cf;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}.piece{position:absolute;width:8px;height:14px;animation:fall 850ms ease-out forwards}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(85vh) rotate(600deg);opacity:0}}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff10}.switch{width:44px;height:26px;border-radius:20px;background:#2a3150;position:relative;cursor:pointer;flex:none}.switch.on{background:var(--purple)}.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}.switch.on i{left:21px}
.levelup{position:fixed;inset:0;background:#0b1020ee;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.levelup h1{font-size:44px;margin:10px 0 4px;background:linear-gradient(90deg,#ffc857,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(min-width:700px){body{padding:20px}.app{border:1px solid #ffffff10;border-radius:28px;background:#0b1020;overflow:hidden;min-height:calc(100vh - 40px)}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">LIFE RPG</div><div class="icons"><button onclick="resetToday()" title="Reset today">↻</button><button onclick="openSettings()" title="Settings">⚙️</button></div></header>
<main id="main"></main>
</div>
<div class="nav"><div class="navin">
<button id="n0" class="active" onclick="tab=0;render()"><span class="ico">⌂</span>Today</button>
<button id="n1" onclick="tab=1;render()"><span class="ico">⚑</span>Quests</button>
<button id="n2" onclick="tab=2;render()"><span class="ico">🎁</span>Rewards</button>
</div></div>
<button class="fab" onclick="openModal()">+</button>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div>

<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet">
<h2>ADD HABIT</h2>
<label>Habit name</label><input id="hn" placeholder="e.g. Read 10 pages">
<label>Emoji</label><input id="he" value="⭐">
<label>Category</label><select id="hc"><option>Health</option><option>Learning</option><option>Cleaning</option><option>Career</option><option>Mind</option><option>Finance</option><option>Sleep</option></select>
<label>Difficulty</label><select id="hd" onchange="syncXp()"><option value="5">Easy</option><option value="10" selected>Medium</option><option value="20">Hard</option><option value="30">Very Hard</option></select>
<label>XP reward (auto, editable)</label><input id="hx" type="number" value="10">
<label>Normal target (minutes)</label><input id="hnorm" type="number" value="20">
<label>Minimum version (minutes) — the "just show up" option</label><input id="hmin" type="number" value="5">
<div style="display:flex;gap:10px"><button class="btn" onclick="addHabit()">ADD HABIT</button><button class="btn" style="background:#ffffff12" onclick="closeModal()">CANCEL</button></div>
</div></div>

<div class="modal" id="settingsModal" onclick="if(event.target.id==='settingsModal')closeSettings()"><div class="sheet">
<h2>SETTINGS</h2>
<div class="toggle"><div><b>Sound effects</b><div class="small">Ding on completion</div></div><div class="switch" id="sw-sound" onclick="toggleSetting('sound')"><i></i></div></div>
<div class="toggle"><div><b>Full animations</b><div class="small">Confetti & celebration screens</div></div><div class="switch" id="sw-anim" onclick="toggleSetting('anim')"><i></i></div></div>
<div style="height:8px"></div>
<button class="btn" style="width:100%" onclick="closeSettings()">DONE</button>
</div></div>

<div class="levelup" id="levelupScreen">
<div style="font-size:60px">🏆</div>
<div class="eyebrow" style="color:#ffc857">LEVEL UP</div>
<h1 id="luLevel">LEVEL 5</h1>
<div class="small" id="luReward" style="margin-bottom:22px">New sound unlocked</div>
<button class="btn" onclick="document.getElementById('levelupScreen').style.display='none'">CONTINUE</button>
</div>

<script>
const KEY='lifeRpgWebV2';
const MAX_ACTIVE=7;
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){
  let old=JSON.parse(localStorage.getItem('lifeRpgWebV1')||'null');
  state={
    xp:0,streak:0,best:0,lastDay:'',comboToday:0,comboBonusGiven:{},questClaimedFor:'',
    settings:{sound:true,anim:true},
    habits:(old&&old.habits)||[
      {id:'water',name:'Drink Water',emoji:'💧',category:'Health',xp:5,done:false,minMin:2,normMin:10},
      {id:'walk',name:'Walk for 20 minutes',emoji:'🚶',category:'Health',xp:10,done:false,minMin:5,normMin:20},
      {id:'study',name:'Study Python',emoji:'📚',category:'Learning',xp:20,done:false,minMin:5,normMin:60},
      {id:'clean',name:'Clean one thing',emoji:'🧹',category:'Cleaning',xp:10,done:false,minMin:5,normMin:15},
      {id:'sleep',name:'Start sleep routine',emoji:'🌙',category:'Sleep',xp:15,done:false,minMin:5,normMin:15}
    ],
    unlockedThemes:['Midnight'],unlockedSounds:['Classic Ding'],missedYesterday:false
  };
  save();
}
if(!state.settings)state.settings={sound:true,anim:true};
if(state.comboToday===undefined)state.comboToday=0;
if(!state.comboBonusGiven)state.comboBonusGiven={};
let tab=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daysBetween(a,b){if(!a)return 99;let pa=a.split('-').map(Number),pb=b.split('-').map(Number);let da=new Date(pa[0],pa[1]-1,pa[2]),db=new Date(pb[0],pb[1]-1,pb[2]);return Math.round((db-da)/86400000)}
(function dailyReset(){
  let gap=daysBetween(state.lastDay,today());
  if(state.lastDay && gap>=1){
    state.missedYesterday = gap>1;
    state.habits.forEach(h=>h.done=false);
    state.comboToday=0;state.comboBonusGiven={};
    if(gap>1){state.streak=0}
    save();
  }
})();
function level(){return 1+Math.floor(state.xp/100)}

// --- sound (Web Audio, no external files needed) ---
let actx=null;
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx}
function beep(freqs,dur,type){
  if(!state.settings.sound)return;
  try{
    let c=ac(),t=c.currentTime;
    freqs.forEach((f,i)=>{
      let o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine';o.frequency.value=f;
      o.connect(g);g.connect(c.destination);
      let start=t+i*0.09;
      g.gain.setValueAtTime(0.0001,start);
      g.gain.exponentialRampToValueAtTime(0.18,start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
      o.start(start);o.stop(start+dur+0.05);
    });
  }catch(e){}
}
function playSound(kind){
  if(kind==='ding')beep([880],0.25,'sine');
  else if(kind==='coin')beep([988,1319],0.18,'square');
  else if(kind==='combo')beep([660,880,1100],0.15,'triangle');
  else if(kind==='achievement')beep([523,659,784,1047],0.22,'sine');
}

function complete(id){
  let h=state.habits.find(x=>x.id===id);if(!h||h.done)return;
  finishHabit(h,h.xp,false);
}
function completeMinimum(id){
  let h=state.habits.find(x=>x.id===id);if(!h||h.done)return;
  let minXp=Math.max(3,Math.round(h.xp*0.5));
  finishHabit(h,minXp,true);
}
function finishHabit(h,xpGain,isMinimum){
  h.done=true;
  let beforeLevel=level();
  state.xp+=xpGain;
  state.missedYesterday=false;
  if(state.lastDay!==today()){state.streak++;state.best=Math.max(state.best,state.streak);state.lastDay=today()}
  state.comboToday++;
  checkUnlocks();
  save();
  let afterLevel=level();
  if(afterLevel>beforeLevel){
    playSound('achievement');
    celebrate(true);
    showLevelUp(afterLevel);
  }else{
    playSound(isMinimum?'ding':'coin');
    celebrate(false);
    toast((isMinimum?'✅ Small win counted! +':'✨ +')+xpGain+' XP');
  }
  maybeCombo();
  render();
}
function maybeCombo(){
  const thresholds=[3,5,8];
  for(const t of thresholds){
    if(state.comboToday>=t && !state.comboBonusGiven[t]){
      state.comboBonusGiven[t]=true;
      let bonus=t*5;
      state.xp+=bonus;
      playSound('combo');
      setTimeout(()=>toast('🔥 COMBO x'+t+'! +'+bonus+' bonus XP'),650);
      save();
    }
  }
}
function checkUnlocks(){
  let l=level();
  if(l>=3&&!state.unlockedSounds.includes('Coin'))state.unlockedSounds.push('Coin');
  if(l>=5&&!state.unlockedThemes.includes('Galaxy'))state.unlockedThemes.push('Galaxy');
  if(l>=7&&!state.unlockedSounds.includes('Achievement'))state.unlockedSounds.push('Achievement');
  if(l>=10&&!state.unlockedThemes.includes('Cyberpunk'))state.unlockedThemes.push('Cyberpunk');
}
function showLevelUp(l){
  if(!state.settings.anim){toast('🏆 LEVEL '+l+'!');return}
  document.getElementById('luLevel').textContent='LEVEL '+l;
  let rewardMsg='Keep going — new rewards ahead.';
  if(l===3)rewardMsg='🔊 New sound unlocked: Coin';
  if(l===5)rewardMsg='🎨 New theme unlocked: Galaxy';
  if(l===7)rewardMsg='🔊 New sound unlocked: Achievement';
  if(l===10)rewardMsg='🎨 New theme unlocked: Cyberpunk';
  document.getElementById('luReward').textContent=rewardMsg;
  document.getElementById('levelupScreen').style.display='flex';
}
function celebrate(big){
  if(!state.settings.anim)return;
  let c=document.getElementById('confetti');c.innerHTML='';
  let n=big?60:30;
  for(let i=0;i<n;i++){let p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.top=(10+Math.random()*20)+'%';p.style.background=['#7c5cff','#48e6a1','#ffc857','#ff8a3d','#fff'][i%5];p.style.animationDelay=Math.random()*150+'ms';c.appendChild(p)}
  setTimeout(()=>c.innerHTML='',1200);
}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>x.classList.remove('show'),1600)}

function render(){
  document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===tab));
  document.getElementById('main').innerHTML=tab===0?home():tab===1?quests():rewards();
}
function home(){
  let done=state.habits.filter(h=>h.done).length,p=state.habits.length?done/state.habits.length:0,l=level(),lp=state.xp%100;
  let banner='';
  if(state.missedYesterday){
    banner=`<div class="banner"><b>Yesterday wasn't your day.</b><span class="small">No problem. Let's get one win today — your momentum is still ${state.streak} day${state.streak===1?'':'s'} strong at heart.</span></div>`;
  }
  return `
${banner}
<div class="card level"><div class="row"><div><div class="eyebrow">CURRENT LEVEL</div><div class="levelnum">LEVEL ${l}</div></div><div class="badge">${l}</div></div><div style="height:18px"></div><div class="bar"><div class="fill" style="width:${lp}%"></div></div><div class="row" style="margin-top:8px"><span class="small">${lp} / 100 XP</span><span class="gold" style="font-weight:1000">${state.xp} TOTAL XP</span></div></div>
<div class="card"><div class="row"><span class="eyebrow">TODAY</span><span class="bigpct">${Math.round(p*100)}%</span></div><div style="height:10px"></div><div class="bar"><div class="fill" style="width:${p*100}%"></div></div></div>
<div class="section"><span>TODAY'S QUEST</span><span class="small">${done}/${state.habits.length}${state.comboToday>=3?' • 🔥 x'+state.comboToday:''}</span></div>
${state.habits.map(h=>`<div class="habit ${h.done?'done':''}">
  <div class="habitmain" onclick="complete('${h.id}')">
    <div class="emoji">${h.done?'✓':h.emoji}</div>
    <div class="habitrow">
      <div class="habitname">${h.name}</div>
      <div class="tags"><span class="tag">${h.category||'General'}</span></div>
      ${(!h.done && h.minMin) ? `<button class="minbtn" onclick="event.stopPropagation();completeMinimum('${h.id}')">Too hard today? Do ${h.minMin} min instead</button>` : `<div class="small">${h.done?'COMPLETED • NICE WORK':'Tap when done'}</div>`}
    </div>
  </div>
  <div class="xp">+${h.xp} XP</div>
</div>`).join('')}
<div class="card momentum"><div class="row"><div><div class="eyebrow">MOMENTUM</div><div style="font-size:25px;font-weight:1000">${state.streak} day${state.streak===1?'':'s'}</div><div class="small">Best: ${state.best} days</div></div><div class="fire">🔥</div></div></div>`;
}
function quests(){
  let daily=Math.min(4,state.habits.filter(h=>h.done).length),weekly=Math.min(25,Math.floor(state.xp/10)),mom=Math.min(7,state.streak);
  if(daily>=4 && state.questClaimedFor!==today()){
    state.questClaimedFor=today();state.xp+=50;save();
    setTimeout(()=>toast('🎉 QUEST COMPLETE! +50 XP'),200);
  }
  return `<h1>QUESTS</h1><div class="small">Small wins. Big XP.</div>${q('⚡','DAILY QUEST','Complete 4 habits',daily,4,50)}${q('🏆','WEEKLY CHALLENGE','Complete 25 tasks this week',weekly,25,250)}${q('🔥','MOMENTUM QUEST','Reach a 7 day momentum',mom,7,100)}`;
}
function q(icon,title,sub,v,max,reward){return `<div class="quest"><div class="eyebrow">${icon} ${title}</div><h3>${sub}</h3><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div><div class="row" style="margin-top:8px"><span class="small">${v} / ${max}</span><span class="gold" style="font-weight:1000">REWARD +${reward} XP</span></div></div>`}
function rewards(){let l=level();return `<h1>REWARDS</h1><div class="small">Unlock new sounds and themes as you level up. Level ${l}.</div><div class="section"><span>🎨 THEMES</span></div>${reward('Midnight',1,state.unlockedThemes)}${reward('Galaxy',5,state.unlockedThemes)}${reward('Cyberpunk',10,state.unlockedThemes)}<div class="section"><span>🔊 SOUNDS</span></div>${reward('Classic Ding',1,state.unlockedSounds)}${reward('Coin',3,state.unlockedSounds)}${reward('Achievement',7,state.unlockedSounds)}`}
function reward(name,lv,arr){let ok=arr.includes(name);return `<div class="card reward"><div class="lock">${ok?'🔓':'🔒'}</div><div style="flex:1"><b>${name}</b><div class="small ${ok?'green':''}">${ok?'UNLOCKED':'Unlock at Level '+lv}</div></div>${ok?'<span class="green">✓</span>':''}</div>`}

function syncXp(){document.getElementById('hx').value=document.getElementById('hd').value}
function openModal(){document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('hn').focus(),50)}
function closeModal(){document.getElementById('modal').style.display='none'}
function addHabit(){
  let n=document.getElementById('hn').value.trim();if(!n)return;
  let activeCount=state.habits.length;
  const doAdd=()=>{
    state.habits.push({
      id:Date.now().toString(),name:n,
      emoji:document.getElementById('he').value.trim()||'⭐',
      category:document.getElementById('hc').value,
      xp:+document.getElementById('hx').value,
      normMin:+document.getElementById('hnorm').value,
      minMin:+document.getElementById('hmin').value,
      done:false
    });
    save();closeModal();render();toast('⭐ New quest added');
  };
  if(activeCount>=MAX_ACTIVE){
    if(confirm(`You currently have ${activeCount} active habits. Adding more can make today harder to complete.\n\nOK = Add anyway\nCancel = Go back`)){
      doAdd();
    }
  }else{
    doAdd();
  }
}
function resetToday(){if(confirm('Reset today\\'s completed habits?')){state.habits.forEach(h=>h.done=false);state.comboToday=0;state.comboBonusGiven={};save();render()}}

function openSettings(){
  document.getElementById('sw-sound').classList.toggle('on',state.settings.sound);
  document.getElementById('sw-anim').classList.toggle('on',state.settings.anim);
  document.getElementById('settingsModal').style.display='flex';
}
function closeSettings(){document.getElementById('settingsModal').style.display='none'}
function toggleSetting(k){
  state.settings[k]=!state.settings[k];save();
  document.getElementById(k==='sound'?'sw-sound':'sw-anim').classList.toggle('on',state.settings[k]);
}
render();
</script>
</body></html>
