<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Life RPG</title>
<style>
:root{--bg:#0b1020;--card:#121936;--card2:#171e3a;--text:#f7f7ff;--muted:#9ba3c7;--purple:#7c5cff;--green:#48e6a1;--gold:#ffc857;--orange:#ff8a3d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0,#21184d 0,#0b1020 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:86px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.logo{font-weight:1000;letter-spacing:2px}.icons button{background:none;border:0;color:white;font-size:21px}
main{padding:10px 16px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
.level{background:linear-gradient(135deg,#261d58,#121936);border-color:#6f55e855}.row{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:11px;color:#aab0cf;letter-spacing:1.6px;font-weight:900}.levelnum{font-size:31px;font-weight:1000;margin-top:3px}.badge{width:60px;height:60px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:1000;font-size:22px}
.bar{height:13px;border-radius:20px;background:#2a3150;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7c5cff,#a77cff);width:0%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.small{font-size:12px;color:var(--muted)}.bigpct{font-size:25px;font-weight:1000}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px;font-size:12px;font-weight:1000;letter-spacing:1.5px}
.habit{display:flex;align-items:center;gap:13px;padding:14px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);margin:9px 0;cursor:pointer;transition:.25s}.habit:active{transform:scale(.98)}.habit.done{background:#14372e;border-color:#48e6a133}.emoji{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;font-size:24px;flex:none}.done .emoji{background:#48e6a122}.check{width:30px;height:30px;border:2px solid #ffffff33;border-radius:50%;display:grid;place-items:center;font-weight:1000}.done .check{background:#48e6a1;color:#06150f;border-color:#48e6a1}.habitname{font-weight:850}.xp{margin-left:auto;color:var(--gold);font-weight:1000;font-size:13px}.done .xp{color:var(--green)}
.momentum{background:linear-gradient(135deg,#42200f,#21130c)}.fire{font-size:35px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1226ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff12;display:flex;justify-content:center;z-index:5}.navin{max-width:560px;width:100%;display:flex}.nav button{flex:1;background:none;border:0;color:#7f87aa;padding:12px 5px 10px;font-size:11px;font-weight:800}.nav button.active{color:white}.nav .ico{display:block;font-size:22px;margin-bottom:2px}.quest{padding:18px;background:rgba(255,255,255,.055);border:1px solid #ffffff0b;border-radius:22px;margin:12px 0}.reward{display:flex;gap:12px;align-items:center}.lock{font-size:24px;width:34px}.green{color:var(--green)}.gold{color:var(--gold)}.purple{color:#a98dff}.btn{border:0;border-radius:14px;background:var(--purple);color:white;padding:12px 17px;font-weight:900}.fab{position:fixed;right:20px;bottom:78px;border:0;width:54px;height:54px;border-radius:50%;background:var(--purple);color:#fff;font-size:28px;box-shadow:0 8px 30px #0008}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#171e3a;border:1px solid #ffffff22;border-radius:18px;padding:14px 18px;font-weight:900;opacity:0;pointer-events:none;transition:.3s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#141a31;border-radius:28px 28px 0 0;padding:22px;max-width:560px;width:100%}input,select{width:100%;padding:13px;border-radius:13px;background:#0c1124;color:white;border:1px solid #ffffff18;margin:6px 0 14px}label{font-size:12px;color:#aab0cf;font-weight:800}.confetti{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}.piece{position:absolute;width:8px;height:14px;animation:fall 850ms ease-out forwards}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(85vh) rotate(600deg);opacity:0}}@media(min-width:700px){body{padding:20px}.app{border:1px solid #ffffff10;border-radius:28px;background:#0b1020;overflow:hidden;min-height:calc(100vh - 40px)}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">LIFE RPG</div><div class="icons"><button onclick="resetToday()">↻</button><button onclick="alert('Cloud Save / Google Drive is planned for the next build.')">☁️</button></div></header>
<main id="main"></main>
</div>
<div class="nav"><div class="navin">
<button id="n0" class="active" onclick="tab=0;render()"><span class="ico">⌂</span>Today</button>
<button id="n1" onclick="tab=1;render()"><span class="ico">⚑</span>Quests</button>
<button id="n2" onclick="tab=2;render()"><span class="ico">🎁</span>Rewards</button>
</div></div>
<button class="fab" onclick="openModal()">+</button>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet">
<h2>ADD HABIT</h2><label>Habit name</label><input id="hn" placeholder="e.g. Read 10 pages"><label>Emoji</label><input id="he" value="⭐"><label>XP reward</label><select id="hx"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select>
<div style="display:flex;gap:10px"><button class="btn" onclick="addHabit()">ADD HABIT</button><button class="btn" style="background:#ffffff12" onclick="closeModal()">CANCEL</button></div>
</div></div>
<script>
const KEY='lifeRpgWebV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 xp:0,streak:0,best:0,lastDay:'',habits:[
 {id:'water',name:'Drink Water',emoji:'💧',xp:5,done:false},
 {id:'walk',name:'Walk for 20 minutes',emoji:'🚶',xp:10,done:false},
 {id:'study',name:'Study Python',emoji:'📚',xp:20,done:false},
 {id:'clean',name:'Clean one thing',emoji:'🧹',xp:10,done:false},
 {id:'sleep',name:'Start sleep routine',emoji:'🌙',xp:15,done:false}],unlockedThemes:['Midnight'],unlockedSounds:['Classic Ding']
};
let tab=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
if(state.lastDay!==today()){state.habits.forEach(h=>h.done=false);save()}
function level(){return 1+Math.floor(state.xp/100)}
function complete(id){
 let h=state.habits.find(x=>x.id===id);if(!h||h.done)return;
 h.done=true;state.xp+=h.xp;
 if(state.lastDay!==today()){state.streak++;state.best=Math.max(state.best,state.streak);state.lastDay=today()}
 if(level()>=3&&!state.unlockedSounds.includes('Coin'))state.unlockedSounds.push('Coin');
 if(level()>=5&&!state.unlockedThemes.includes('Galaxy'))state.unlockedThemes.push('Galaxy');
 if(level()>=7&&!state.unlockedSounds.includes('Achievement'))state.unlockedSounds.push('Achievement');
 if(level()>=10&&!state.unlockedThemes.includes('Cyberpunk'))state.unlockedThemes.push('Cyberpunk');
 save();celebrate();toast('✨ +'+h.xp+' XP — QUEST COMPLETE!');render()
}
function celebrate(){let c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<34;i++){let p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.top=(10+Math.random()*20)+'%';p.style.background=['#7c5cff','#48e6a1','#ffc857','#ff8a3d','#fff'][i%5];p.style.animationDelay=Math.random()*120+'ms';c.appendChild(p)}setTimeout(()=>c.innerHTML='',1100)}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function render(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===tab));document.getElementById('main').innerHTML=tab===0?home():tab===1?quests():rewards()}
function home(){let done=state.habits.filter(h=>h.done).length,p=state.habits.length?done/state.habits.length:0,l=level(),lp=state.xp%100;return `
<div class="card level"><div class="row"><div><div class="eyebrow">CURRENT LEVEL</div><div class="levelnum">LEVEL ${l}</div></div><div class="badge">${l}</div></div><div style="height:18px"></div><div class="bar"><div class="fill" style="width:${lp}%"></div></div><div class="row" style="margin-top:8px"><span class="small">${lp} / 100 XP</span><span class="gold" style="font-weight:1000">${state.xp} TOTAL XP</span></div></div>
<div class="card"><div class="row"><span class="eyebrow">TODAY</span><span class="bigpct">${Math.round(p*100)}%</span></div><div style="height:10px"></div><div class="bar"><div class="fill" style="width:${p*100}%"></div></div></div>
<div class="section"><span>TODAY'S QUEST</span><span class="small">${done}/${state.habits.length}</span></div>
${state.habits.map(h=>`<div class="habit ${h.done?'done':''}" onclick="complete('${h.id}')"><div class="emoji">${h.done?'✓':h.emoji}</div><div style="flex:1"><div class="habitname">${h.name}</div><div class="small">${h.done?'COMPLETED • NICE WORK':'Tap when done'}</div></div><div class="xp">+${h.xp} XP</div></div>`).join('')}
<div class="card momentum"><div class="row"><div><div class="eyebrow">MOMENTUM</div><div style="font-size:25px;font-weight:1000">${state.streak} day${state.streak===1?'':'s'}</div><div class="small">Best: ${state.best} days</div></div><div class="fire">🔥</div></div></div>`}
function quests(){let daily=Math.min(4,state.habits.filter(h=>h.done).length),weekly=Math.min(25,Math.floor(state.xp/10)),mom=Math.min(7,state.streak);return `<h1>QUESTS</h1><div class="small">Small wins. Big XP.</div>${q('⚡','DAILY QUEST','Complete 4 habits',daily,4,50)}${q('🏆','WEEKLY CHALLENGE','Complete 25 tasks this week',weekly,25,250)}${q('🔥','MOMENTUM QUEST','Reach a 7 day momentum',mom,7,100)}`}
function q(icon,title,sub,v,max,reward){return `<div class="quest"><div class="eyebrow">${icon} ${title}</div><h3>${sub}</h3><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div><div class="row" style="margin-top:8px"><span class="small">${v} / ${max}</span><span class="gold" style="font-weight:1000">REWARD +${reward} XP</span></div></div>`}
function rewards(){let l=level();return `<h1>REWARDS</h1><div class="small">Unlock new sounds and themes as you level up. Level ${l}.</div><div class="section"><span>🎨 THEMES</span></div>${reward('Midnight',1,state.unlockedThemes)}${reward('Galaxy',5,state.unlockedThemes)}${reward('Cyberpunk',10,state.unlockedThemes)}<div class="section"><span>🔊 SOUNDS</span></div>${reward('Classic Ding',1,state.unlockedSounds)}${reward('Coin',3,state.unlockedSounds)}${reward('Achievement',7,state.unlockedSounds)}`}
function reward(name,lv,arr){let ok=arr.includes(name);return `<div class="card reward"><div class="lock">${ok?'🔓':'🔒'}</div><div style="flex:1"><b>${name}</b><div class="small ${ok?'green':''}">${ok?'UNLOCKED':'Unlock at Level '+lv}</div></div>${ok?'<span class="green">✓</span>':''}</div>`}
function openModal(){document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('hn').focus(),50)}
function closeModal(){document.getElementById('modal').style.display='none'}
function addHabit(){let n=document.getElementById('hn').value.trim();if(!n)return;state.habits.push({id:Date.now().toString(),name:n,emoji:document.getElementById('he').value.trim()||'⭐',xp:+document.getElementById('hx').value,done:false});save();closeModal();render();toast('⭐ New quest added')}
function resetToday(){if(confirm('Reset today\\'s completed habits?')){state.habits.forEach(h=>h.done=false);save();render()}}
render();
</script>
</body></html>
